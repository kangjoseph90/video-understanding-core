[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-understanding-core"
version = "0.1.0"
description = "Agentic video-understanding core for vision-only LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.4",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
sensevoice = [
  "funasr>=1.3.1",
  "torch>=2.2",
  "torchaudio>=2.2",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
vuc = "vuc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vuc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

