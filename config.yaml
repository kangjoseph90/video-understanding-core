cache:
  directory: .vuc-cache

video:
  short_threshold_s: 600
  allowed_extensions: [mp4, webm, mkv]

indexer:
  backend: sensevoice
  hub: hf
  model: FunAudioLLM/SenseVoiceSmall
  vad_model: fsmn-vad
  device: cpu
  cpu_threads: 8
  batch_size_s: 60
  max_segment_s: 30
  merge_vad: true
  merge_length_s: 15
  initial_prompt_tokens: 20000

frames:
  initial_interval_s: 30
  initial_resolution: 256
  baseline_interval_s: 15
  baseline_resolution: 512
  montage_enabled: true
  montage_grid: 3x3
  jpeg_quality: 88

vision_llm:
  base_url_env: VLM_BASE_URL
  model_env: VLM_MODEL
  api_key_env: VLM_API_KEY
  max_images_per_request: 16
  max_image_resolution: 768

asr:
  advanced:
    provider: local
    max_segment_s: 600
    local:
      backend: faster-whisper
      model: large-v3-turbo
      device: cpu
      compute_type: int8
    cloud:
      base_url_env: VUC_ASR_BASE_URL
      model_env: VUC_ASR_MODEL
      api_key_env: VUC_ASR_API_KEY
      timeout_s: 120
      max_retries: 3
      concurrency: 3
      cost_per_minute_usd: 0.0

agent:
  query: "영상의 핵심 내용을 근거와 함께 요약 보고서로 작성해 주세요."
  max_tool_calls: 12
  max_input_tokens: 200000
  wall_clock_s: 600
  calibration_enabled: true
  calibration_segments: 3
  calibration_segment_s: 30

tools:
  view_frames:
    allowed_fps: [0.1, 0.2, 0.5, 1, 2]
    allowed_resolutions: [256, 512, 768]
    max_frames_per_call: 16

output:
  markdown: true
  json: true

benchmark:
  judge_base_url_env: VUC_JUDGE_BASE_URL
  judge_model_env: VUC_JUDGE_MODEL
  judge_api_key_env: VUC_JUDGE_API_KEY
  cost_accounting:
    local_asr_metric: processing_seconds
    cloud_asr_metric: usd
