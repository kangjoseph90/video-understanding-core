cache:
  directory: .vuc-cache

run:
  mode: agentic

video:
  allowed_extensions: [mp4, webm, mkv]

indexer:
  hub: hf
  model: FunAudioLLM/SenseVoiceSmall
  vad_model: fsmn-vad
  device: cpu
  cpu_threads: 8
  batch_size_s: 60
  max_segment_s: 30
  merge_vad: true
  merge_length_s: 15

frames:
  index_interval_s: 15
  baseline_full_interval_s: 1
  montage_width: 1344
  montage_height: 756
  montage_n: 3
  jpeg_quality: 88

vision_llm:
  base_url_env: VLM_BASE_URL
  model_env: VLM_MODEL
  api_key_env: VLM_API_KEY
  timeout_s: 180
  max_retries: 2
  max_output_tokens: 8192
  input_cost_per_million_usd: 0.0
  output_cost_per_million_usd: 0.0

asr:
  advanced:
    provider: local
    local:
      model: large-v3-turbo
      device: cpu
      compute_type: int8
      cpu_threads: 8
      max_segment_s: 180
    cloud:
      max_segment_s: 600

agent:
  query: "영상의 핵심 내용을 근거와 함께 요약 보고서로 작성해 주세요."
  max_tool_calls: 12
  wall_clock_s: 600

tools:
  view_frames:
    fps_options: [0.1, 0.2, 0.5, 1.0, 2.0]
    grid_options: [1, 2, 3, 4, 6]
    max_montages_per_call: 16
