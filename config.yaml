cache:
  directory: .vuc-cache

run:
  mode: agentic

video:
  allowed_extensions: [mp4, webm, mkv]

vad:
  provider: fsmn
  hub: hf
  model: fsmn-vad
  device: cpu
  cpu_threads: 8
  max_single_segment_s: 30
  merge_gap_s: 1.5
  min_bridge_s: 1.0
  min_region_s: 2.0
  window_max_s: 30

audio_events:
  tagger: panns
  top_k: 4
  min_confidence: 0.2
  relative_floor: 0.4
  window_s: 10
  model_path: ""

visual_scan:
  scan_fps: 2
  scan_width: 320
  scene_threshold: 0.3
  min_interval_s: 2
  max_interval_s: 30
  boundary_offset_s: 0.25
  settle_step_s: 0.25
  settle_max_s: 1.5
  phash_distance: 12
  max_frames: 120
  workers: 4
  # Hardware-accelerated decoding: d3d11va (Windows AMD/Intel), videotoolbox (macOS), cuda (Nvidia), auto, or none
  hwaccel: none

ocr:
  enabled: true
  engine: rapidocr
  # Inference device: cpu, dml (DirectML for Windows AMD/Intel/Nvidia), or cuda
  device: cpu
  scan_fps: 4
  scan_width: 448
  recognition_width: 1280
  workers: 4
  change_threshold: 0.06
  refresh_s: 4
  boundary_offset_s: 0.75
  min_confidence: 0.7
  singleton_confidence: 0.95
  min_text_height: 0.025
  max_hold_s: 30
  same_text_ratio: 0.8
  rejoin_gap_s: 4
  use_angle_cls: false
  det_model_path: models/ocr/PP-OCRv6_tiny_det.onnx
  det_model_config_path: models/ocr/PP-OCRv6_tiny_det.yml
  rec_model_path: models/ocr/PP-OCRv6_small_rec.onnx
  rec_keys_path: models/ocr/PP-OCRv6_small_dict.txt
  fallback_rec_model_path: models/ocr/korean_PP-OCRv5_rec.onnx
  fallback_rec_keys_path: models/ocr/korean_PP-OCRv5_dict.txt
  rec_by_language:
    ko:
      model: models/ocr/korean_PP-OCRv5_rec.onnx
      keys: models/ocr/korean_PP-OCRv5_dict.txt
    en:
      model: models/ocr/PP-OCRv6_small_rec.onnx
      keys: models/ocr/PP-OCRv6_small_dict.txt
    zh:
      model: models/ocr/PP-OCRv6_small_rec.onnx
      keys: models/ocr/PP-OCRv6_small_dict.txt
    ja:
      model: models/ocr/PP-OCRv6_small_rec.onnx
      keys: models/ocr/PP-OCRv6_small_dict.txt

indexer:
  hub: hf
  model: FunAudioLLM/SenseVoiceSmall
  device: cpu
  cpu_threads: 2
  batch_size_s: 60

captions:
  # A channel-provided caption track may correct the transcript or the screen
  # text, but only after it is judged to be one or the other. Thresholds sit
  # far from the measured values; see src/vuc/caption_fusion.py.
  enabled: true
  vad_overlap_min: 0.6
  ocr_match_min: 0.7
  script_ratio_min: 0.05
  ocr_window_s: 3.0
  align_ratio_min: 0.2
  scope_ratio_min: 0.8
  scope_ratio_max: 1.25
  text_match_min: 0.55
  # Each caption line is routed over its neighbourhood, not the whole track.
  window_s: 30.0
  window_min_cues: 3

frames:
  index_montage_n: 3
  baseline_full_interval_s: 1
  baseline_full_montage_n: 3

montage:
  width: 1344
  height: 756
  jpeg_quality: 88

vision_llm:
  base_url_env: VLM_BASE_URL
  model_env: VLM_MODEL
  api_key_env: VLM_API_KEY
  # Token rates live beside VLM_MODEL in .env so the model and its prices are
  # swapped together. Unset rates mean "unknown" and vlm_cost_usd stays null.
  input_cost_env: VLM_INPUT_COST_PER_MTOK
  cached_input_cost_env: VLM_CACHED_INPUT_COST_PER_MTOK
  output_cost_env: VLM_OUTPUT_COST_PER_MTOK
  timeout_s: 180
  max_retries: 2
  max_output_tokens: 32768
  temperature: null

asr:
  advanced:
    provider: local
    local:
      model: large-v3-turbo
      device: cpu
      compute_type: int8
      cpu_threads: 8
      max_segment_s: 180
    cloud:
      max_segment_s: 600

agent:
  query: "영상의 핵심 내용을 근거와 함께 요약 보고서로 작성해 주세요."
  max_tool_calls: 12
  wall_clock_s: 600

tools:
  view_frames:
    fps_options: [0.1, 0.2, 0.5, 1.0, 2.0]
    grid_options: [1, 2, 3, 4]
    max_montages_per_call: 16
  transcribe_segment:
    max_duration_s: 60
